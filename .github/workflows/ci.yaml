name: Validate separate applications
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mayraviq_test
          POSTGRES_USER: mayraviq
          POSTGRES_PASSWORD: ci-disposable-database
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U mayraviq -d mayraviq_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://mayraviq:ci-disposable-database@127.0.0.1:5432/mayraviq_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - run: npm run build:api
      - run: npm audit --omit=dev --audit-level=high
      - run: docker compose --env-file .env.example -f compose.yaml -f compose.ai.yaml config --quiet
      - run: docker build -f infra/docker/api.Dockerfile -t mayraviq-api:ci .
      - run: docker build -f infra/docker/web.Dockerfile -t mayraviq-web:ci .
